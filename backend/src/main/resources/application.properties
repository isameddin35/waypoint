spring.application.name=waypoint

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/waypoint
spring.datasource.username=waypoint
spring.datasource.password=waypoint
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# JWT
jwt.secret=WaypointSecretKeyForJWTTokenGeneration2024MustBe256BitsLongMin
jwt.expiration.ms=86400000

# Server
server.port=8080

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
